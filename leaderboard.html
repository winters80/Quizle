<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Night — Leaderboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">

    <nav class="navbar">
      <div class="navbar-inner">
        <a href="index.html" class="navbar-brand">&#9733; Quiz Night</a>
        <div class="navbar-user">
          <a href="index.html" class="nav-link">Home</a>
          <span class="navbar-handle" id="nav-handle"></span>
        </div>
      </div>
    </nav>

    <main style="flex:1; padding: 2rem 0;">
      <div class="container" style="max-width:700px;">

        <div style="text-align:center; margin-bottom:2rem;">
          <h1 class="gradient-text">Leaderboard</h1>
          <p class="text-muted mt-sm">Weekly &amp; Monthly champions</p>
        </div>

        <!-- Weekly Winner Banner -->
        <div id="weekly-winner-banner" class="mb-lg hidden">
          <div class="winner-banner">
            <span class="winner-crown">&#127942;</span>
            <p class="text-muted" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:0.25rem;">This Week's Champion</p>
            <h2 class="gold-text" id="weekly-winner-name">—</h2>
            <p class="text-muted" id="weekly-winner-stat"></p>
          </div>
        </div>

        <!-- Monthly Winner Banner -->
        <div id="monthly-winner-banner" class="mb-lg hidden">
          <div class="winner-banner" style="border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow);">
            <span class="winner-crown">&#127881;</span>
            <p class="text-muted" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:0.25rem;">Monthly Champion</p>
            <h2 class="gradient-text" id="monthly-winner-name">—</h2>
            <p class="text-muted" id="monthly-winner-stat"></p>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs mb-lg">
          <button class="tab active" id="tab-weekly" onclick="switchTab('weekly')">Weekly</button>
          <button class="tab" id="tab-monthly" onclick="switchTab('monthly')">Monthly</button>
          <button class="tab" id="tab-alltime" onclick="switchTab('alltime')">All Time</button>
        </div>

        <!-- Weekly Leaderboard -->
        <div id="board-weekly">
          <div class="flex items-center justify-between mb-md">
            <h3>Week of <span id="week-label">—</span></h3>
            <span class="text-dim" style="font-size:0.8rem;" id="weekly-game-count"></span>
          </div>
          <div id="weekly-list">
            <div class="skeleton" style="height:56px; margin-bottom:0.5rem;"></div>
            <div class="skeleton" style="height:56px; margin-bottom:0.5rem;"></div>
            <div class="skeleton" style="height:56px;"></div>
          </div>
          <p class="text-dim text-center mt-md hidden" id="weekly-empty" style="font-size:0.875rem;">No games played this week yet.</p>
        </div>

        <!-- Monthly Leaderboard -->
        <div id="board-monthly" class="hidden">
          <div class="flex items-center justify-between mb-md">
            <h3>Month of <span id="month-label">—</span></h3>
            <span class="text-dim" style="font-size:0.8rem;" id="monthly-game-count"></span>
          </div>
          <div id="monthly-list"></div>
          <p class="text-dim text-center mt-md hidden" id="monthly-empty" style="font-size:0.875rem;">No games played this month yet.</p>
        </div>

        <!-- All Time Leaderboard -->
        <div id="board-alltime" class="hidden">
          <div class="flex items-center justify-between mb-md">
            <h3>All Time</h3>
            <span class="text-dim" style="font-size:0.8rem;" id="alltime-game-count"></span>
          </div>
          <div id="alltime-list"></div>
          <p class="text-dim text-center mt-md hidden" id="alltime-empty" style="font-size:0.875rem;">No games played yet.</p>
        </div>

        <!-- Recent Games -->
        <div class="mt-xl">
          <h3 class="mb-md">Recent Games</h3>
          <div id="recent-games-list">
            <div class="skeleton" style="height:72px; margin-bottom:0.5rem;"></div>
            <div class="skeleton" style="height:72px;"></div>
          </div>
          <p class="text-dim text-center mt-md hidden" id="recent-empty" style="font-size:0.875rem;">No games played yet.</p>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="js/leaderboard.js"></script>
  <script>
    function switchTab(tab) {
      ['weekly','monthly','alltime'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
        document.getElementById('board-' + t).classList.toggle('hidden', t !== tab);
      });
    }
  </script>
</body>
</html>
